[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geopack-sdk"
version = "0.5.4"
authors = [
  { name="Geopack Team", email="info@geopack.com" },
]
description = "A professional Python SDK for Geopack Geoportal API"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "geopandas>=0.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
async = ["httpx>=0.27.0"]
mcp = ["mcp>=1.6.0,<2"]
llm = ["openai>=1.0.0"]
langchain = [
    "openai>=1.0.0",
    "langchain>=0.3.18",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.7",
    "langgraph>=0.2.60",
]
dev = ["pytest>=7.0.0", "mcp>=1.6.0,<2"]
all = [
    "httpx>=0.27.0",
    "mcp>=1.6.0,<2",
    "openai>=1.0.0",
    "langchain>=0.3.18",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.7",
    "langgraph>=0.2.60",
]

[project.scripts]
geopack-sdk-mcp = "geopack_sdk_mcp.__main__:main"

[project.urls]
"Homepage" = "https://github.com/niranshahi/geopack-python-sdk"
"Bug Tracker" = "https://github.com/niranshahi/geopack-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
