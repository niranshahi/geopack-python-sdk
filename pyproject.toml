[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geopack-sdk"
version = "0.1.0"
authors = [
  { name="Geopack Team", email="info@geopack.com" },
]
description = "A professional Python SDK for Geopack Geoportal API"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "geopandas>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/niranshahi/geopack-python-sdk"
"Bug Tracker" = "https://github.com/niranshahi/geopack-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
