<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>

__USER_CSS_LINK__
<style>
  :root {
    --gp-header: #0b3d2e;
    --gp-accent: #3ba776;
    --gp-text: #10221b;
    --gp-panel: #ffffff;
__CSS_VARS__
  }
   { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--gp-text); }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { background: var(--gp-header); color: #fff; padding: 8px 14px; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  #main { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; right: 10px; width: 260px; max-height: calc(100% - 20px);
    overflow: auto; background: var(--gp-panel); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  #panel section { padding: 8px 10px; border-bottom: 1px solid rgba(0,0,0,.08); }
  #panel h2 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row input[type=range] { flex: 1; }
  .row .gp-zoom { flex: 0 0 auto; border: 0; background: transparent; cursor: pointer; padding: 2px 3px;
    color: var(--gp-text); opacity: .55; line-height: 0; border-radius: 4px; }
  .row .gp-zoom:hover { opacity: 1; background: rgba(0,0,0,.08); }
  .row .gp-zoom svg { display: block; }
  #basemap { width: 100%; padding: 4px; }
  #legend .item { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.3); }
  #legend .swatch.raster { background: repeating-linear-gradient(45deg, #8a9a93, #8a9a93 3px, #cfd8d4 3px, #cfd8d4 6px); }
  #panel .gp-empty { opacity: .6; font-style: italic; }
  #legend .item .progress { margin-left: auto; font-size: 10px; opacity: .8; white-space: nowrap; }
  #legend .item .progress .bar { display: inline-block; width: 46px; height: 6px; border-radius: 3px;
    background: rgba(0,0,0,.12); overflow: hidden; vertical-align: middle; margin-right: 4px; }
  #legend .item .progress .bar i { display: block; height: 100%; width: 0; background: var(--gp-accent); transition: width .15s linear; }
  #legend .item .progress .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid rgba(0,0,0,.15);
    border-top-color: var(--gp-accent); border-radius: 50%; animation: gp-spin .8s linear infinite; vertical-align: middle; }
  #legend .legend-block { margin: 6px 0; }
  #legend .legend-block .item > .head { font-weight: 600; }
  #legend .legend-sub { padding-left: 20px; font-size: 12px; opacity: .95; }
  @keyframes gp-spin { to { transform: rotate(360deg); } }
  footer { background: #f4f6f5; color: #4b5b54; padding: 5px 14px; font-size: 11px; }
  #banner { position: absolute; left: 10px; top: 10px; z-index: 5; max-width: 60%;
    background: #b3261e; color: #fff; padding: 6px 10px; border-radius: 6px; display: none; }
  #identify { position: absolute; z-index: 6; max-width: 320px; max-height: 300px; overflow: auto;
    background: var(--gp-panel); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.3);
    display: none; font-size: 12px; }
  #identify .gp-id-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    background: var(--gp-header); color: #fff; border-radius: 8px 8px 0 0; position: sticky; top: 0; }
  #identify .gp-id-head span { flex: 1; font-weight: 600; }
  #identify .gp-id-head button { background: transparent; border: 0; color: #fff; cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 2px; }
  #identify table { border-collapse: collapse; width: 100%; }
  #identify th, #identify td { text-align: left; padding: 3px 8px; vertical-align: top;
    border-bottom: 1px solid rgba(0,0,0,.06); }
  #identify th { font-weight: 600; opacity: .75; white-space: nowrap; }
  #identify .gp-id-ftr { padding: 4px 8px; opacity: .6; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>__TITLE__</h1>
    <p id="subtitle">__SUBTITLE__</p>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="banner"></div>
    <div id="identify"></div>
    <div id="panel"></div>
  </div>
  <footer id="footer">__FOOTER__</footer>
</div>
